name: Radar Rojo (Radar Global)

# Escanea todos los partidos en vivo cada 15 min, en la nube de GitHub, gratis.
# Nota honesta: el cron de GitHub es "best-effort" — bajo carga puede retrasarse
# varios minutos o saltarse un ciclo. La latencia real puede pasar de 15 min.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # permite ejecutarlo a mano desde la pestaña Actions

# Evita que dos corridas se pisen (comparten el mismo estado en el repo).
concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write   # para guardar el estado (commit) entre corridas

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escanear (una corrida)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python radar_cycle.py

      - name: Guardar el estado (commit)
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios de estado."
          else
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          fi

# (re-registro del workflow)
