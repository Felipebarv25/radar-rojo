name: Radar Rojo (Radar Global)

# Escanea los partidos en vivo. Detección cada ~10 min en la franja activa del
# usuario (11am-medianoche Colombia = 16:00-05:00 UTC, tarde europea + noche
# americana), y espaciada (cada hora) en la madrugada. Cubrir tarde Y noche no cabe
# a 5 min en el plan gratis, así que se usan 10 min: 78 + 11 = ~89 requests/día.
# Nota honesta: el cron de GitHub es "best-effort" — puede retrasarse o tardar en
# activarse en repos nuevos. ~10 min no es garantizado ni es tiempo real.
on:
  schedule:
    - cron: "*/10 16-23,0-4 * * *"  # cada 10 min, 11am-medianoche Colombia
    - cron: "0 5-15 * * *"          # madrugada: una vez por hora
  workflow_dispatch: {}             # permite ejecutarlo a mano desde Actions

# Evita que dos corridas se pisen (comparten el mismo estado en el repo).
concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write   # para guardar el estado (commit) entre corridas

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escanear (una corrida)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python radar_cycle.py

      - name: Guardar el estado (commit)
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios de estado."
          else
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          fi

# (re-registro del workflow)
