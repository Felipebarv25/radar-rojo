name: Radar Rojo (Radar Global)

# Escanea los partidos en vivo. Detección RÁPIDA (cada 5 min) en la franja activa
# del usuario (11am-5pm Colombia = 16-22 UTC), y espaciada (cada hora) el resto del
# día. Así la PRIMERA alerta de roja llega en ~5 min en las horas que importan,
# sin pasarse del cupo gratis (72 + 18 = ~90 requests/día).
# Nota honesta: el cron de GitHub es "best-effort" — puede retrasarse. ~5 min no es
# garantizado ni es tiempo real; es "más rápido", no "instantáneo".
on:
  schedule:
    - cron: "*/5 16-21 * * *"      # RÁPIDO: cada 5 min, 11am-5pm Colombia
    - cron: "0 0-15,22,23 * * *"   # resto del día: una vez por hora
  workflow_dispatch: {}            # permite ejecutarlo a mano desde Actions

# Evita que dos corridas se pisen (comparten el mismo estado en el repo).
concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write   # para guardar el estado (commit) entre corridas

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escanear (una corrida)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python radar_cycle.py

      - name: Guardar el estado (commit)
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios de estado."
          else
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          fi

# (re-registro del workflow)
